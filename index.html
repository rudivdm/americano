<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Americano Padel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F7; --surface:#FFFFFF; --ink:#0E1A2B; --muted:#5B6B80; --border:#D6DEE8;
  --court:#1F5FBF; --court-deep:#174A96; --line:rgba(255,255,255,.88);
  --ball:#DDF247; --ball-ink:#1B2400; --danger:#B83227; --soft:#E3EAF3;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A1220; --surface:#121D30; --ink:#E8EEF7; --muted:#8FA0B7; --border:#24334A;
    --court:#2366CC; --court-deep:#1A4E9E; --soft:#1A2840; --danger:#E5675B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1220; --surface:#121D30; --ink:#E8EEF7; --muted:#8FA0B7; --border:#24334A;
  --court:#2366CC; --court-deep:#1A4E9E; --soft:#1A2840; --danger:#E5675B;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
.cond{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif}

header.top{background:var(--court);color:#fff;padding:18px 18px 16px;position:relative;overflow:hidden}
header.top::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;
  background:var(--ball);opacity:.95;box-shadow:inset -14px -10px 0 rgba(0,0,0,.08)}
header.top::before{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;
  border:3px solid rgba(255,255,255,.75);border-color:transparent rgba(255,255,255,.75) transparent transparent;transform:rotate(30deg) scale(.82);z-index:1}
.top h1{margin:0;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:34px;line-height:1;letter-spacing:.2px;max-width:75%;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top p{margin:6px 0 0;opacity:.85;font-size:14px;max-width:75%}

main{max-width:640px;margin:0 auto;padding:16px 14px 110px}
h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:26px;margin:4px 0 12px;line-height:1.1}
h3{font-size:15px;font-weight:600;margin:20px 0 8px;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);
  display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav.tabs button{flex:1;background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:13px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--court)}
nav.tabs button[aria-current="page"] .dot{background:var(--ball)}
.dot{width:6px;height:6px;border-radius:50%;background:transparent}
nav.tabs button:disabled{opacity:.35;cursor:default}

/* round strip */
.strip{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px 6px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.chip-r{flex:0 0 auto;min-width:42px;height:42px;border-radius:21px;border:2px solid var(--border);background:var(--surface);
  font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:19px;display:grid;place-items:center;padding:0 10px}
.chip-r.done{background:var(--court);border-color:var(--court);color:#fff}
.chip-r.on{border-color:var(--ink);box-shadow:0 0 0 3px var(--ball)}
.roundhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.roundhead h2{margin:0}

/* the court */
.match{margin-bottom:16px}
.court{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--court);border-radius:10px;
  padding:7px;min-height:132px;box-shadow:0 1px 0 var(--court-deep),0 6px 18px -10px rgba(10,30,70,.6)}
.court::before{content:"";position:absolute;inset:7px;border:2px solid var(--line);border-radius:3px;pointer-events:none}
.court::after{content:"";position:absolute;top:7px;bottom:7px;left:50%;width:0;border-left:3px dashed rgba(255,255,255,.95);transform:translateX(-1.5px);pointer-events:none}
.svc{position:absolute;top:50%;height:2px;background:var(--line);pointer-events:none}
.svc.l{left:calc(7px + 18%);right:50%}
.svc.r{left:50%;right:calc(7px + 18%)}
.svcv{position:absolute;top:7px;bottom:7px;width:2px;background:var(--line);pointer-events:none}
.svcv.l{left:calc(7px + 18%)}
.svcv.r{right:calc(7px + 18%)}
.side{position:relative;z-index:2;background:none;border:0;color:#fff;display:flex;align-items:center;gap:8px;padding:10px 14px;text-align:left;min-width:0}
.side.b{flex-direction:row-reverse;text-align:right}
.names{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.names span{font-weight:600;font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:rgba(23,74,150,.55);padding:2px 6px;border-radius:4px;align-self:flex-start;max-width:100%}
.side.b .names span{align-self:flex-end}
.score{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:46px;line-height:1;min-width:44px;text-align:center;
  font-variant-numeric:tabular-nums}
.score.empty{width:44px;height:44px;border-radius:50%;border:2px dashed rgba(255,255,255,.7);font-size:15px;font-weight:600;display:grid;place-items:center;font-family:"Barlow",sans-serif}
.score.win{color:var(--ball)}
.mlabel{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:6px 2px 0}
.byes{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:15px;margin-bottom:14px}
.byes b{font-weight:600}
.pager{display:flex;gap:10px;margin-top:6px}

/* buttons */
.btn{border:0;border-radius:10px;padding:13px 16px;font-weight:700;font-size:16px;background:var(--soft);color:var(--ink)}
.btn.primary{background:var(--ball);color:var(--ball-ink)}
.btn.court{background:var(--court);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--border)}
.btn.danger{background:transparent;border:1.5px solid var(--danger);color:var(--danger)}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.grow{flex:1}

/* standings */
.table{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.trow{display:grid;grid-template-columns:30px 1fr 48px 30px 62px 42px;align-items:center;gap:4px;padding:11px 12px;border-top:1px solid var(--border);
  font-variant-numeric:tabular-nums}
.trow.wide{grid-template-columns:30px 1fr 48px 30px 62px 42px 44px}
.trow:first-child{border-top:0}
.trow.head{font-size:12.5px;color:var(--muted);font-weight:600;padding-top:9px;padding-bottom:9px;background:var(--soft)}
.trow .r{text-align:right}
.trow .c{text-align:center}
.rank{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:20px}
.pts{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:22px;text-align:right}
.pname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow.lead{background:linear-gradient(90deg,color-mix(in srgb,var(--ball) 38%,transparent),transparent 70%)}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.progress{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin:6px 0 16px}
.progress i{display:block;height:100%;background:var(--court)}

/* setup */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px}
.field{display:block;margin-bottom:4px}
.text{width:100%;border:1.5px solid var(--border);background:var(--bg);border-radius:9px;padding:11px 12px;font-size:16px}
.text:focus{border-color:var(--court);outline:none}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;gap:8px;align-items:center}
.prow .num{width:26px;text-align:center;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:18px;color:var(--muted)}
.iconbtn{width:42px;height:42px;flex:0 0 42px;border-radius:9px;border:1.5px solid var(--border);background:none;display:grid;place-items:center;color:var(--muted);font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--border);background:var(--surface);border-radius:20px;padding:8px 16px;font-weight:600;font-size:15px}
.chip[aria-pressed="true"]{background:var(--court);border-color:var(--court);color:#fff}
.stepper{display:flex;align-items:center;gap:10px}
.stepper output{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:28px;min-width:40px;text-align:center}
.teams{display:flex;flex-direction:column;gap:10px}
.teamhead{display:flex;justify-content:space-between;align-items:center;font-weight:600;margin-bottom:8px}
.toggle{display:flex;gap:12px;align-items:center;font-weight:600;margin-bottom:6px;cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--court);flex:0 0 auto}
.err{color:var(--danger);font-weight:600;margin-top:8px}
.saved{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 4px;border-top:1px solid var(--border)}
.saved:first-child{border-top:0}
.savedmain{flex:1;min-width:0;background:none;border:0;text-align:left;padding:8px 8px;display:flex;flex-direction:column;gap:2px;border-radius:8px}
.savedmain .pname{font-size:17px}
.tag{display:inline-block;background:var(--ball);color:var(--ball-ink);font-size:12px;font-weight:700;padding:1px 7px;border-radius:10px;margin-left:6px;vertical-align:2px}
.summary{background:var(--soft);border-radius:10px;padding:12px 14px;font-size:15px;margin:18px 0 14px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,12,25,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));
  max-height:85vh;overflow:auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h3{margin:0 0 4px;color:var(--ink);font-size:18px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0}
.grid button{border:1.5px solid var(--border);background:var(--bg);border-radius:10px;padding:10px 0;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:22px}
.grid button.sel{background:var(--ball);border-color:var(--ball);color:var(--ball-ink)}
.grid button .vs{display:block;font-family:"Barlow",sans-serif;font-size:11px;font-weight:600;color:var(--muted);margin-top:-2px}
.grid button.sel .vs{color:var(--ball-ink)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:20px;font-weight:600;font-size:14px;z-index:50}
textarea.text{min-height:220px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.empty-state{text-align:center;padding:40px 10px}
@media (min-width:560px){.court{min-height:150px}.score{font-size:54px}}
</style>
</head>
<body>
<header class="top"><h1 id="title">Americano</h1><p id="sub"></p></header>
<main id="app"></main>
<nav class="tabs" id="tabs"></nav>
<div id="layer"></div>
<input type="file" id="importer" accept=".json,application/json,text/plain" hidden>

<script>
(function(){
const LS='americano-padel-v1';
const MAXP=12, MINP=4;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);

function freshDraft(prev){
  return {name:prev?.name||'Saturday Americano', names:prev?.names||Array(8).fill(''), target:prev?.target||24,
    mode:prev?.mode||'total', format:prev?.format||'individual', courts:null, rounds:null};
}
function fresh(){return {v:1,phase:'setup',format:'individual',teamOrder:[],name:'Americano',players:[],target:24,mode:'total',courts:1,rounds:[],draft:freshDraft(),updatedAt:0}}
function load(){try{const s=localStorage.getItem(LS);return s?JSON.parse(s):null}catch(e){return null}}
let S=load()||fresh();
const LIB='americano-padel-library-v1';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
let LIBR=(()=>{try{return JSON.parse(localStorage.getItem(LIB))||{}}catch(e){return {}}})();
const norm=x=>String(x||'').trim().toLowerCase().replace(/\s+/g,' ');
function nameTaken(name,exceptId){return Object.values(LIBR).some(t=>t.id!==exceptId&&norm(t.name)===norm(name))}
function uniqueName(name,exceptId){let n=name,k=2;while(nameTaken(n,exceptId))n=`${name} (${k++})`;return n}
function persistLib(){try{localStorage.setItem(LIB,JSON.stringify(LIBR))}catch(e){}}
if(S.phase==='play'){if(!S.id)S.id=uid();if(!LIBR[S.id]){LIBR[S.id]=S;persistLib()}}
let ui={tab:S.phase==='play'?'rounds':'setup', round:firstOpenRound(), sort:'total', sheet:null};

/* ---------- persistence ---------- */
let dbRef=null, pushT=null;
function save(){
  S.updatedAt=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
  if(S.phase==='play'){if(!S.id)S.id=uid();LIBR[S.id]=S}
  persistLib(); pushDb();
}
function pushDb(){
  if(dbRef){clearTimeout(pushT);pushT=setTimeout(()=>{dbRef.set({state:JSON.stringify(S),lib:JSON.stringify(LIBR),updatedAt:Date.now()}).catch(()=>{})},700)}
}
(async()=>{
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id(); if(!id)return;
    const ref=db.doc('data/users/'+id+'/americano');
    const snap=await ref.get(); const d=snap&&snap.data?snap.data():null;
    if(d&&d.lib){try{const rl=JSON.parse(d.lib);Object.values(rl).forEach(t=>{const l=LIBR[t.id];if(!l||(t.updatedAt||0)>(l.updatedAt||0)){LIBR[t.id]=t;if(S.id===t.id)S=t}});persistLib()}catch(e){}}
    if(d&&d.state){
      const remote=JSON.parse(d.state);
      if((remote.updatedAt||0)>(S.updatedAt||0)){
        S=remote; try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
        ui.tab=S.phase==='play'?'rounds':'setup'; ui.round=firstOpenRound(); render();
      }
    }
    dbRef=ref; render(); pushDb();
  }catch(e){}
})();

/* ---------- scheduling ---------- */
const mat=n=>Array.from({length:n},()=>Array(n).fill(0));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function counts(n,rounds){
  const C={P:mat(n),O:mat(n),B:Array(n).fill(0),last:[]};
  rounds.forEach(r=>apply(C,r)); return C;
}
function apply(C,r){
  r.byes.forEach(i=>C.B[i]++);
  r.matches.forEach(m=>{
    C.P[m.a[0]][m.a[1]]++;C.P[m.a[1]][m.a[0]]++;C.P[m.b[0]][m.b[1]]++;C.P[m.b[1]][m.b[0]]++;
    m.a.forEach(x=>m.b.forEach(y=>{C.O[x][y]++;C.O[y][x]++}));
  });
  C.last=r.byes.slice();
}
function makeRound(n,courts,C,tries){
  const sit=n-courts*4; let best=null,bp=Infinity;
  for(let t=0;t<tries;t++){
    const order=shuffle([...Array(n).keys()]);
    let sitters=[];
    if(sit>0) sitters=order.slice().sort((a,b)=>C.B[a]-C.B[b]).slice(0,sit);
    const act=order.filter(i=>!sitters.includes(i));
    let pen=0; sitters.forEach(i=>{if(C.last.includes(i))pen+=40});
    const ms=[];
    for(let c=0;c<courts;c++){
      const g=act.slice(c*4,c*4+4), a=[g[0],g[1]], b=[g[2],g[3]];
      const pa=C.P[a[0]][a[1]], pb=C.P[b[0]][b[1]];
      pen+=100*(pa*pa+pa)+100*(pb*pb+pb);
      a.forEach(x=>b.forEach(y=>{const o=C.O[x][y];pen+=4*(o*o+o)}));
      ms.push({court:c+1,a,b,sa:null,sb:null});
    }
    if(pen<bp){bp=pen;best={matches:ms,byes:sitters.sort((x,y)=>x-y)};if(pen===0)break}
  }
  return {round:best,pen:bp};
}
function buildSchedule(n,courts,rounds){
  let best=null,bp=Infinity;
  const restarts=n>=12?150:(n<=8?60:40);
  for(let r=0;r<restarts;r++){
    const C=counts(n,[]); const out=[]; let tot=0;
    for(let k=0;k<rounds;k++){const {round,pen}=makeRound(n,courts,C,n>=12?1200:500);tot+=pen;apply(C,round);out.push(round)}
    if(tot<bp){bp=tot;best=out;if(tot===0)break}
  }
  return best;
}
function suggestRounds(n,courts){
  const sit=n-courts*4;
  if(sit===0) return n-1;
  for(let r=n-1;r<=n*2;r++) if((r*sit)%n===0) return r;
  return n;
}

const pairOf=t=>[2*t,2*t+1];
const isTeam=()=>S.format==='team';
const suggestTeamRounds=T=>T%2?T:T-1;
function teamRound(order,k){
  const arr=order.slice(); if(arr.length%2)arr.push(-1);
  const m=arr.length, rest=arr.slice(1), rot=k%(m-1);
  const full=[arr[0],...rest.slice(rot),...rest.slice(0,rot)];
  const matches=[],byes=[];
  for(let i=0;i<m/2;i++){
    let x=full[i],y=full[m-1-i];
    if(x<0||y<0){byes.push(...pairOf(x<0?y:x));continue}
    if((k+i)%2){[x,y]=[y,x]}
    matches.push({court:matches.length+1,a:pairOf(x),b:pairOf(y),sa:null,sb:null});
  }
  return {matches,byes:byes.sort((a,b)=>a-b)};
}
function teamSchedule(T,rounds){S.teamOrder=shuffle([...Array(T).keys()]);return Array.from({length:rounds},(_,k)=>teamRound(S.teamOrder,k))}
const teamName=t=>`${S.players[2*t]} & ${S.players[2*t+1]}`;

/* ---------- stats ---------- */
const done=m=>m.sa!=null&&m.sb!=null;
const roundDone=r=>r.matches.every(done);
function firstOpenRound(){const i=(S.rounds||[]).findIndex(r=>!roundDone(r));return i<0?Math.max(0,(S.rounds||[]).length-1):i}
function stats(){
  const st=S.players.map((name,i)=>({i,name,pts:0,ag:0,p:0,w:0,d:0,l:0,byes:0}));
  S.rounds.forEach(r=>{
    r.byes.forEach(i=>st[i].byes++);
    r.matches.forEach(m=>{
      if(!done(m))return;
      [[m.a,m.sa,m.sb],[m.b,m.sb,m.sa]].forEach(([t,f,a])=>t.forEach(i=>{
        const s=st[i];s.pts+=f;s.ag+=a;s.p++; if(f>a)s.w++;else if(f<a)s.l++;else s.d++;
      }));
    });
  });
  return st;
}
function rows(sort){let l=ranked(sort);if(isTeam())l=l.filter(s=>s.i%2===0).map(s=>Object.assign({},s,{name:teamName(s.i/2)}));return l}
function ranked(sort){
  const st=stats();
  const avg=s=>s.p?s.pts/s.p:0;
  return st.sort((x,y)=> sort==='avg'
    ? (avg(y)-avg(x))||((y.pts-y.ag)-(x.pts-x.ag))||(y.w-x.w)
    : (y.pts-x.pts)||((y.pts-y.ag)-(x.pts-x.ag))||(y.w-x.w)||x.name.localeCompare(y.name));
}

/* ---------- render ---------- */
const icons={
  rounds:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M12 5v14M3 12h4M17 12h4"/></svg>',
  standings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V11M10 20V5M16 20v-6M22 20H2"/></svg>',
  setup:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.3-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M17 4.5a3.5 3.5 0 0 1 0 7M19 14.8c1.4.9 2.2 2.7 2.5 5.2"/></svg>'
};
function render(){
  const playing=S.phase==='play';
  $('#title').textContent=playing?S.name:'Americano Padel';
  $('#sub').textContent=playing
    ? `${isTeam()?S.players.length/2+' teams':S.players.length+' players'}, ${S.courts} court${S.courts>1?'s':''}, ${S.mode==='total'?S.target+' points per match':'free scoring'}`
    : 'Rotate partners, count every point.';
  const tabs=[['rounds','Rounds'],['standings','Standings'],['setup',playing?(isTeam()?'Teams':'Players'):'Setup']];
  $('#tabs').innerHTML=tabs.map(([k,l])=>`<button data-act="tab" data-v="${k}" ${!playing&&k!=='setup'?'disabled':''} ${ui.tab===k?'aria-current="page"':''}>${icons[k]}<span>${l}</span><span class="dot"></span></button>`).join('');
  const app=$('#app');
  if(!playing) app.innerHTML=viewSetup();
  else if(ui.tab==='rounds') app.innerHTML=viewRounds();
  else if(ui.tab==='standings') app.innerHTML=viewStandings();
  else app.innerHTML=viewManage();
  renderLayer();
  if(ui.tab==='rounds'){const on=document.querySelector('.chip-r.on');on&&on.scrollIntoView({inline:'center',block:'nearest'})}
}

function savedHTML(title){
  const items=Object.values(LIBR).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  if(!items.length)return '';
  return `<h3>${title}</h3><div class="table">${items.map(t=>{
    const tot=t.rounds.reduce((a,r)=>a+r.matches.length,0), pl=t.rounds.reduce((a,r)=>a+r.matches.filter(done).length,0);
    const nxt=t.rounds.findIndex(r=>!roundDone(r));
    const status=pl===tot?'Finished':pl===0?'Not started':`Round ${nxt+1} of ${t.rounds.length}`;
    const who=t.format==='team'?`${t.players.length/2} teams`:`${t.players.length} players`;
    const when=t.updatedAt?new Date(t.updatedAt).toLocaleDateString(undefined,{day:'numeric',month:'short'}):'';
    const cur=S.phase==='play'&&S.id===t.id;
    return `<div class="saved"><button class="savedmain" data-act="opensaved" data-v="${t.id}">
      <span class="pname">${esc(t.name)}${cur?'<span class="tag">Open</span>':''}</span>
      <span class="small muted">${status}, ${who}${when?', '+when:''}</span></button>
      <button class="iconbtn" data-act="confirm" data-v="del:${t.id}" aria-label="Delete ${esc(t.name)}">×</button></div>`}).join('')}</div>`;
}

function viewSetup(){
  const d=S.draft; const team=d.format==='team';
  const n=d.names.length, T=n/2;
  const maxC=team?Math.floor(T/2):Math.max(1,Math.floor(n/4));
  const courts=team?maxC:Math.min(d.courts||maxC,maxC);
  const sug=team?suggestTeamRounds(T):suggestRounds(n,courts);
  const rounds=d.rounds||sug;
  const sit=n-courts*4;
  const input=i=>`<input class="text" data-in="pname" data-i="${i}" value="${esc(d.names[i])}" placeholder="Player ${i+1}" maxlength="24" autocomplete="off">`;
  let people, summary;
  if(team){
    people=`<h3>Teams (${T} of 6)</h3><div class="teams">
      ${[...Array(T).keys()].map(t=>`<div class="card"><div class="teamhead"><span>Team ${t+1}</span>
        <button class="iconbtn" data-act="rmteam" data-v="${t}" aria-label="Remove team ${t+1}" ${T<=2?'disabled':''}>×</button></div>
        <div class="plist">${input(2*t)}${input(2*t+1)}</div></div>`).join('')}</div>
      <button class="btn ghost block" style="margin-top:10px" data-act="addteam" ${T>=6?'disabled':''}>${T>=6?'Maximum of 6 teams':'Add team'}</button>`;
    const cyc=suggestTeamRounds(T), games=Math.round(rounds*courts*2/T*10)/10;
    summary=`Each round: ${courts} match${courts>1?'es':''}${T%2?', 1 team sits out':', every team plays'}. `+
      (rounds===cyc?'Every team plays every other team once.':rounds>cyc?`Every team plays every other team, some twice (about ${games} games each).`:`Each team plays ${games<T-1?'about '+games+' of the '+(T-1)+' other teams':'every other team'}.`);
  }else{
    people=`<h3>Players (${n} of ${MAXP})</h3>
    <div class="card"><div class="plist">
      ${d.names.map((nm,i)=>`<div class="prow"><span class="num">${i+1}</span>${input(i)}
        <button class="iconbtn" data-act="rmp" data-i="${i}" aria-label="Remove player ${i+1}" ${n<=MINP?'disabled':''}>×</button></div>`).join('')}
    </div>
    <button class="btn ghost block" style="margin-top:10px" data-act="addp" ${n>=MAXP?'disabled':''}>${n>=MAXP?'Maximum of 12 players':'Add player'}</button>
    </div>`;
    const games=Math.round(rounds*courts*4/n*10)/10;
    summary=`Each round: ${courts} match${courts>1?'es':''}${sit>0?`, ${sit} player${sit>1?'s':''} sit${sit>1?'':'s'} out`:', everyone plays'}. Each player gets about ${games} games${sit===0&&rounds===n-1?', partnering every other player once':''}.`;
  }
  const taken=nameTaken(d.name.trim()||'Americano');
  const saved=savedHTML('Resume a tournament');
  return `${saved?saved+'<div style="height:22px"></div>':''}
  <h2>New tournament</h2>
  <div class="card">
    <label class="field small muted" for="tname">Tournament name (must be unique)</label>
    <input class="text" id="tname" data-in="tname" value="${esc(d.name)}" maxlength="40">
    <div class="err small" id="nameerr" ${taken?'':'hidden'}>${taken?nameErrText(d.name):''}</div>
  </div>
  <h3>Format</h3>
  <div class="seg">
    <button data-act="format" data-v="individual" aria-pressed="${!team}">Rotating partners</button>
    <button data-act="format" data-v="team" aria-pressed="${team}">Fixed teams</button>
  </div>
  <div class="small muted" style="margin:-4px 2px 4px">${team?'Pairs stay together all tournament and play each other team in turn.':'Partners change every round. Everyone scores for themselves.'}</div>
  ${people}
  <h3>Points per match</h3>
  <div class="chips">${[16,21,24,32].map(p=>`<button class="chip" data-act="target" data-v="${p}" aria-pressed="${d.target===p}">${p}</button>`).join('')}</div>
  <h3>Scoring</h3>
  <div class="seg">
    <button data-act="mode" data-v="total" aria-pressed="${d.mode==='total'}">Scores add up to ${d.target}</button>
    <button data-act="mode" data-v="free" aria-pressed="${d.mode==='free'}">Free scoring</button>
  </div>
  <h3>Courts</h3>
  ${team?`<div class="small">${courts} court${courts>1?'s':''}, one per match.</div>`
    :`<div class="chips">${[...Array(maxC).keys()].map(c=>`<button class="chip" data-act="courts" data-v="${c+1}" aria-pressed="${courts===c+1}">${c+1} court${c?'s':''}</button>`).join('')}</div>`}
  <h3>Rounds</h3>
  <div class="stepper">
    <button class="iconbtn" data-act="rounds" data-v="-1" aria-label="Fewer rounds">−</button>
    <output>${rounds}</output>
    <button class="iconbtn" data-act="rounds" data-v="1" aria-label="More rounds">+</button>
    <span class="small muted">Suggested: ${sug}</span>
  </div>
  <div class="summary">${summary}</div>
  <button class="btn primary block" data-act="start">Start tournament</button>
  <button class="btn ghost block" style="margin-top:10px" data-act="openfile">Open saved tournament</button>`;
}

function nameErrText(n){return `There's already a tournament called "${esc(n.trim()||'Americano')}". Pick another name, or resume it from the list above.`}

function viewRounds(){
  const R=S.rounds; if(!R.length) return '<div class="empty-state">No rounds yet.</div>';
  const i=Math.min(ui.round,R.length-1); const r=R[i];
  const P=S.players;
  const sideHTML=(m,mi,t)=>{
    const team=m[t], s=t==='a'?m.sa:m.sb, o=t==='a'?m.sb:m.sa;
    const win=done(m)&&s>o;
    const sc=s==null?`<span class="score empty">Tap</span>`:`<span class="score${win?' win':''}">${s}</span>`;
    return `<button class="side ${t}" data-act="score" data-m="${mi}" data-t="${t}" aria-label="Score for ${esc(P[team[0]])} and ${esc(P[team[1]])}${s==null?'':': '+s}">
      <span class="names"><span>${esc(P[team[0]])}</span><span>${esc(P[team[1]])}</span></span>${sc}</button>`;
  };
  return `
  <div class="strip" role="tablist">${R.map((x,k)=>`<button class="chip-r${roundDone(x)?' done':''}${k===i?' on':''}" data-act="goround" data-v="${k}" aria-label="Round ${k+1}${roundDone(x)?', finished':''}">${k+1}</button>`).join('')}</div>
  <div class="roundhead"><h2>Round ${i+1} <span class="muted" style="font-weight:500">of ${R.length}</span></h2>
    <span class="small muted">${r.matches.filter(done).length}/${r.matches.length} scored</span></div>
  ${r.matches.map((m,mi)=>`<div class="match"><div class="court"><span class="svc l"></span><span class="svc r"></span><span class="svcv l"></span><span class="svcv r"></span>
    ${sideHTML(m,mi,'a')}${sideHTML(m,mi,'b')}</div>
    <div class="mlabel"><span>Court ${m.court}</span><span>${done(m)?(m.sa===m.sb?'Draw':'Final'):'Not played yet'}</span></div></div>`).join('')}
  ${r.byes.length?`<div class="byes">Sitting out: <b>${(isTeam()?r.byes.filter((b,k)=>k%2===0).map(b=>esc(teamName(b/2))):r.byes.map(b=>esc(P[b]))).join(', ')}</b></div>`:''}
  <div class="pager">
    <button class="btn ghost grow" data-act="goround" data-v="${i-1}" ${i===0?'disabled':''}>Previous</button>
    ${i<R.length-1?`<button class="btn court grow" data-act="goround" data-v="${i+1}">Next round</button>`
      :`<button class="btn primary grow" data-act="tab" data-v="standings">See standings</button>`}
  </div>
  ${i===R.length-1?`<button class="btn ghost block" style="margin-top:10px" data-act="addround">Add another round</button>`:''}`;
}

function viewStandings(){
  const total=S.rounds.reduce((a,r)=>a+r.matches.length,0);
  const played=S.rounds.reduce((a,r)=>a+r.matches.filter(done).length,0);
  const hasByes=S.rounds.some(r=>r.byes.length);
  const list=rows(ui.sort);
  const finished=played===total&&total>0;
  const fmtAvg=s=>s.p?(s.pts/s.p).toFixed(1):'–';
  const wide=hasByes;
  return `
  <h2>${finished?'Final standings':'Standings'}</h2>
  <div class="small muted">${played} of ${total} matches played</div>
  <div class="progress"><i style="width:${total?played/total*100:0}%"></i></div>
  ${hasByes?`<div class="seg"><button data-act="sort" data-v="total" aria-pressed="${ui.sort==='total'}">Total points</button><button data-act="sort" data-v="avg" aria-pressed="${ui.sort==='avg'}">Points per game</button></div>`:''}
  <div class="table">
    <div class="trow head${wide?' wide':''}"><span>#</span><span>${isTeam()?'Team':'Player'}</span><span class="r">Pts</span><span class="c">P</span><span class="c">W-D-L</span><span class="r">+/−</span>${wide?'<span class="r">Avg</span>':''}</div>
    ${list.map((s,k)=>{const diff=s.pts-s.ag;return `<div class="trow${wide?' wide':''}${k===0&&played?' lead':''}">
      <span class="rank">${k+1}</span><span class="pname">${esc(s.name)}</span><span class="pts">${s.pts}</span>
      <span class="c">${s.p}</span><span class="c small">${s.w}-${s.d}-${s.l}</span>
      <span class="r small">${diff>0?'+':''}${diff}</span>${wide?`<span class="r small">${fmtAvg(s)}</span>`:''}</div>`}).join('')}
  </div>
  <p class="small muted">Ranked by ${ui.sort==='avg'?'points per game played':'total points'}, then point difference, then wins.</p>
  <button class="btn ghost block" data-act="copy">Copy standings</button>`;
}

function viewManage(){
  const anyScore=S.rounds.some(r=>r.matches.some(done));
  return `
  <h2>Players &amp; settings</h2>
  <div class="card">
    <label class="field small muted" for="tname2">Tournament name</label>
    <input class="text" id="tname2" data-in="tname2" value="${esc(S.name)}" maxlength="40">
  </div>
  <h3>Rename players</h3>
  ${isTeam()?`<div class="teams">${[...Array(S.players.length/2).keys()].map(t=>`<div class="card"><div class="teamhead"><span>Team ${t+1}</span></div><div class="plist">${[2*t,2*t+1].map(i=>`<input class="text" data-in="rename" data-i="${i}" value="${esc(S.players[i])}" maxlength="24" autocomplete="off">`).join('')}</div></div>`).join('')}</div>`
  :`<div class="card"><div class="plist">
    ${S.players.map((nm,i)=>`<div class="prow"><span class="num">${i+1}</span><input class="text" data-in="rename" data-i="${i}" value="${esc(nm)}" maxlength="24" autocomplete="off"></div>`).join('')}
  </div></div>`}
  <div class="summary">${isTeam()?'Fixed teams':'Rotating partners'}, ${S.rounds.length} rounds, ${S.courts} court${S.courts>1?'s':''}, ${S.mode==='total'?`scores add up to ${S.target}`:'free scoring'}.</div>
  <h3>Save and resume</h3>
  <div class="card" style="margin-bottom:18px">
    <label class="toggle"><input type="checkbox" id="autofile" ${S.autoFile!==false?'checked':''}><span>Save a file after each round</span></label>
    <p class="small muted" style="margin:0 0 12px">Scores are also kept on this phone as you go. A saved file lets you resume on another phone or after the browser is cleared.</p>
    <div style="display:flex;flex-direction:column;gap:10px">
      <button class="btn court block" data-act="savefile">Save tournament file</button>
      <button class="btn ghost block" data-act="openfile">Open saved tournament</button>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:10px">
    <button class="btn ghost block" data-act="addround">Add another round</button>
    <button class="btn ghost block" data-act="confirm" data-v="reshuffle">${anyScore?'Restart with new draw':'Reshuffle the draw'}</button>
    <button class="btn primary block" data-act="newt">Start another tournament</button>
  </div>
  ${savedHTML('Saved tournaments')}`;
}

function renderLayer(){
  const L=$('#layer'); const sh=ui.sheet;
  if(!sh){L.innerHTML='';return}
  let body='';
  if(sh.type==='score'){
    const m=S.rounds[ui.round].matches[sh.m]; const P=S.players;
    const team=m[sh.t], cur=sh.t==='a'?m.sa:m.sb;
    const max=S.mode==='total'?S.target:Math.max(S.target,30);
    body=`<h3>${esc(P[team[0]])} &amp; ${esc(P[team[1]])}</h3>
      <div class="small muted">${S.mode==='total'?`Pick their score. The other team gets the rest of ${S.target}.`:'Pick their score.'}</div>
      <div class="grid">${[...Array(max+1).keys()].map(v=>`<button class="${cur===v?'sel':''}" data-act="pick" data-v="${v}">${v}${S.mode==='total'?`<span class="vs">vs ${S.target-v}</span>`:''}</button>`).join('')}</div>
      <div class="pager"><button class="btn ghost grow" data-act="clearscore">Clear score</button><button class="btn grow" data-act="close">Cancel</button></div>`;
  }else if(sh.type==='confirm'){
    const dt=sh.v.startsWith('del:')?LIBR[sh.v.slice(4)]:null;
    const msg=dt?['Delete this tournament?',`"${esc(dt.name)}" and all its scores will be removed from this phone. Files you've saved are not affected.`,'Delete tournament']
      :['Make a new draw?','Every round is regenerated and all entered scores are cleared.','Clear scores and redraw'];
    body=`<h3>${msg[0]}</h3><p class="muted">${msg[1]}</p><div class="pager"><button class="btn grow" data-act="close">Cancel</button><button class="btn danger grow" data-act="doconfirm" data-v="${sh.v}">${msg[2]}</button></div>`;
  }else if(sh.type==='import'){
    body=`<h3>Replace "${esc(sh.state.name||'Americano')}"?</h3><p class="muted">This tournament is already on this phone. Opening the file replaces it with the file's scores.</p><div class="pager"><button class="btn grow" data-act="close">Cancel</button><button class="btn primary grow" data-act="doimport">Use the file</button></div>`;
  }else if(sh.type==='copy'){
    body=`<h3>Standings</h3><p class="small muted">Select the text and copy it.</p><textarea class="text" readonly>${esc(sh.text)}</textarea><button class="btn block" style="margin-top:10px" data-act="close">Done</button>`;
  }
  L.innerHTML=`<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true">${body}</div></div>`;
}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}

/* ---------- files ---------- */
let dl=null;
(async()=>{try{if(window.claude&&window.claude.use)dl=await window.claude.use('downloads')}catch(e){}})();
function fileBase(){return (S.name||'americano').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'americano'}
function payload(){return JSON.stringify({app:'americano-padel',version:1,savedAt:new Date().toISOString(),state:S})}
async function writeFile(filename,msg,share){
  const data=payload();
  if(dl){
    try{await dl.save({filename,data});toast(msg);return true}
    catch(e){const c=e&&e.code;if(c==='declined')return false;if(c==='rate_limited'){toast('Finish the open save first');return false}}
  }
  const file=new File([data],filename,{type:'application/json'});
  if(share){
    try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:S.name});return true}}
    catch(e){if(e&&e.name==='AbortError')return false}
  }
  try{
    const url=URL.createObjectURL(file);const a=document.createElement('a');
    a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000);toast(msg);return true;
  }catch(e){toast('This browser blocked the save');return false}
}
function openFile(file){
  const r=new FileReader();
  r.onload=()=>{
    let st;
    try{const j=JSON.parse(r.result);st=j&&j.state?j.state:j;
      if(!st||!Array.isArray(st.players)||!Array.isArray(st.rounds)||!st.phase)throw 0}
    catch(e){toast('That file is not a saved tournament');return}
    if(!st.id)st.id=uid();
    if(LIBR[st.id]){ui.sheet={type:'import',state:st};renderLayer()}
    else{st.name=uniqueName(st.name||'Americano',st.id);loadState(st)}
  };
  r.onerror=()=>toast('Could not read that file');
  r.readAsText(file);
}
function loadState(st){
  const keepT=st.updatedAt; S=st;if(!S.draft)S.draft=freshDraft();if(!S.format)S.format='individual';if(!S.draft.format)S.draft.format='individual';
  ui.sheet=null;ui.tab=S.phase==='play'?'rounds':'setup';ui.round=firstOpenRound();save();if(keepT&&S.phase==='play'){S.updatedAt=keepT;LIBR[S.id]=S;persistLib()}render();window.scrollTo(0,0);toast(`Opened ${S.name}`);
}
document.getElementById('importer').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f)openFile(f);e.target.value=''});

function standingsText(){
  const list=rows(ui.sort);
  return `${S.name}\n`+list.map((s,k)=>`${k+1}. ${s.name}  ${s.pts} pts  (${s.p} played, ${s.w}-${s.d}-${s.l}, ${s.pts-s.ag>=0?'+':''}${s.pts-s.ag})`).join('\n');
}

/* ---------- actions ---------- */
function start(){
  const d=S.draft; const n=d.names.length;
  const names=d.names.map((x,i)=>x.trim()||`Player ${i+1}`);
  const team=d.format==='team', T=n/2;
  const maxC=team?Math.floor(T/2):Math.floor(n/4); const courts=team?maxC:Math.min(d.courts||maxC,maxC);
  const rounds=d.rounds||(team?suggestTeamRounds(T):suggestRounds(n,courts));
  S.id=uid(); S.name=d.name.trim()||'Americano'; S.players=names; S.target=d.target; S.mode=d.mode; S.courts=courts; S.format=team?'team':'individual';
  S.rounds=team?teamSchedule(T,rounds):buildSchedule(n,courts,rounds); S.phase='play';
  ui.tab='rounds'; ui.round=0; save(); render();
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el||el.disabled)return;
  const a=el.dataset.act, v=el.dataset.v; const d=S.draft;
  if(a==='scrim'){if(e.target===el){ui.sheet=null;renderLayer()}return}
  switch(a){
    case 'tab': ui.tab=v; if(v==='rounds')ui.round=firstOpenRound(); render(); window.scrollTo(0,0); break;
    case 'addp': if(d.names.length<MAXP){d.names.push('');d.rounds=null;save();render();const ins=document.querySelectorAll('[data-in="pname"]');ins[ins.length-1].focus()} break;
    case 'rmp': d.names.splice(+el.dataset.i,1);d.rounds=null;save();render();break;
    case 'format': d.format=v; d.rounds=null;
      if(v==='team'&&d.names.length%2)d.names.push('');
      save();render();break;
    case 'addteam': if(d.names.length<MAXP){d.names.push('','');d.rounds=null;save();render();const ins=document.querySelectorAll('[data-in="pname"]');ins[ins.length-2].focus()} break;
    case 'rmteam': d.names.splice(2*(+v),2);d.rounds=null;save();render();break;
    case 'target': d.target=+v;save();render();break;
    case 'mode': d.mode=v;save();render();break;
    case 'courts': d.courts=+v;d.rounds=null;save();render();break;
    case 'rounds':{const n=d.names.length,maxC=Math.floor(n/4),c=Math.min(d.courts||maxC,maxC);
      const sg=d.format==='team'?suggestTeamRounds(n/2):suggestRounds(n,c);
      d.rounds=Math.max(1,Math.min(30,(d.rounds||sg)+(+v)));save();render();break}
    case 'start': if(nameTaken(d.name.trim()||'Americano')){render();const t=$('#tname');t&&t.focus();toast('Pick a unique tournament name');break}
      el.disabled=true; el.textContent='Making the draw…'; setTimeout(start,40); break;
    case 'goround': ui.round=+v; render(); window.scrollTo(0,0); break;
    case 'score': ui.sheet={type:'score',m:+el.dataset.m,t:el.dataset.t}; renderLayer(); break;
    case 'pick':{const m=S.rounds[ui.round].matches[ui.sheet.m]; const x=+v; const was=roundDone(S.rounds[ui.round]);
      if(S.mode==='total'){ if(ui.sheet.t==='a'){m.sa=x;m.sb=S.target-x}else{m.sb=x;m.sa=S.target-x} }
      else{ if(ui.sheet.t==='a')m.sa=x;else m.sb=x;
        if((ui.sheet.t==='a'?m.sb:m.sa)==null){ui.sheet={type:'score',m:ui.sheet.m,t:ui.sheet.t==='a'?'b':'a'};save();render();break} }
      ui.sheet=null; save(); render();
      if(!was&&roundDone(S.rounds[ui.round])){
        const k=ui.round, last=k===S.rounds.length-1&&S.rounds.every(roundDone);
        if(S.autoFile!==false) writeFile(`${fileBase()}-${last?'final':'after-round-'+(k+1)}.json`,last?'All rounds scored, final file saved':`Round ${k+1} saved to file`,false);
        else toast(last?'All rounds scored':`Round ${k+1} complete`);
      }
      break}
    case 'clearscore':{const m=S.rounds[ui.round].matches[ui.sheet.m];m.sa=null;m.sb=null;ui.sheet=null;save();render();break}
    case 'savefile': writeFile(`${fileBase()}-${new Date().toISOString().slice(0,10)}.json`,'Tournament saved',true); break;
    case 'openfile': document.getElementById('importer').click(); break;
    case 'doimport': loadState(ui.sheet.state); break;
    case 'close': ui.sheet=null; renderLayer(); break;
    case 'sort': ui.sort=v; render(); break;
    case 'addround':{if(isTeam())S.rounds.push(teamRound(S.teamOrder,S.rounds.length));else{const C=counts(S.players.length,S.rounds);S.rounds.push(makeRound(S.players.length,S.courts,C,3000).round)}
      ui.round=S.rounds.length-1;ui.tab='rounds';save();render();toast(`Round ${S.rounds.length} added`);break}
    case 'confirm': ui.sheet={type:'confirm',v}; renderLayer(); break;
    case 'opensaved':{const t=LIBR[v];if(!t)break;if(S.phase==='play'&&S.id===v){ui.tab='rounds';ui.round=firstOpenRound();render();window.scrollTo(0,0);break}
      loadState(JSON.parse(JSON.stringify(t)));break}
    case 'newt':{const base=S.name.replace(/\s*\(\d+\)$/,'');
      S=Object.assign(fresh(),{draft:freshDraft({name:uniqueName(base),names:S.players.slice(),target:S.target,mode:S.mode,format:S.format})});
      ui.tab='setup';save();render();window.scrollTo(0,0);break}
    case 'doconfirm':
      if(v.startsWith('del:')){const id=v.slice(4);const wasCur=S.id===id;delete LIBR[id];
        if(wasCur){S=Object.assign(fresh(),{draft:freshDraft({names:S.players.slice(),target:S.target,mode:S.mode,format:S.format,name:uniqueName('Saturday Americano')})});ui.tab='setup'}
        toast('Tournament deleted')}
      else{el.disabled=true;el.textContent='Making the draw…';setTimeout(()=>{S.rounds=isTeam()?teamSchedule(S.players.length/2,S.rounds.length):buildSchedule(S.players.length,S.courts,S.rounds.length);ui.round=0;ui.tab='rounds';ui.sheet=null;save();render();window.scrollTo(0,0)},40);break}
      ui.sheet=null; save(); render(); window.scrollTo(0,0); break;
    case 'copy':{const t=standingsText();
      const fallback=()=>{ui.sheet={type:'copy',text:t};renderLayer()};
      try{navigator.clipboard.writeText(t).then(()=>toast('Standings copied'),fallback)}catch(err){fallback()}
      break}
  }
});
document.addEventListener('input',e=>{
  const el=e.target; const k=el.dataset.in; if(!k)return;
  if(k==='tname'){S.draft.name=el.value;const er=$('#nameerr');if(er){const tk=nameTaken(el.value.trim()||'Americano');er.hidden=!tk;er.innerHTML=tk?nameErrText(el.value):''}}
  else if(k==='pname')S.draft.names[+el.dataset.i]=el.value;
  else if(k==='tname2'){$('#title').textContent=el.value||'Americano';return}
  else if(k==='rename')S.players[+el.dataset.i]=el.value;
  save();
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='autofile'){S.autoFile=el.checked;save();return}
  if(el.dataset.in==='rename'&&!el.value.trim()){S.players[+el.dataset.i]=`Player ${+el.dataset.i+1}`;save();render()}
  if(el.dataset.in==='tname2'){const nv=el.value.trim()||'Americano';
    if(nameTaken(nv,S.id)){toast('Another tournament already uses that name');render();return}
    S.name=nv;save();render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.sheet){ui.sheet=null;renderLayer()}});
if(!S.draft)S.draft=freshDraft();
if(!S.format)S.format='individual';if(!S.draft.format)S.draft.format='individual';
render();
})();
</script>
</body>
</html>
